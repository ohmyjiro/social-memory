<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">저장한 글에서, 다시 쓸 아이디어까지.</title><desc id="desc">Social Memory의 개념 도식. 실제 제품 화면이 아닙니다.</desc><rect width="1080" height="420" rx="24" fill="#101b2b"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#edf3fa"><text x="40" y="43" fill="#80d9c6" font-size="13" letter-spacing="2">SOCIAL MEMORY / WORKFLOW</text><text x="40" y="87" font-size="30" font-weight="700">저장한 글에서, 다시 쓸 아이디어까지.</text><rect x="40" y="135" width="270" height="160" rx="15" fill="#263a51" stroke="#40546b"/><text x="62" y="171" font-size="19" font-weight="650">01  선택해서 모으기</text><text x="62" y="200" fill="#b9cadb" font-size="15">X · Threads · JSON 가져오기</text><text x="62" y="225" fill="#b9cadb" font-size="15">좋아요 / 북마크 / 리포스트</text><text x="62" y="250" fill="#b9cadb" font-size="15">계정별 전용 브라우저 프로필</text><rect x="405" y="135" width="270" height="160" rx="15" fill="#173932" stroke="#40546b"/><text x="427" y="171" font-size="19" font-weight="650">02  내 자료실에 보관</text><text x="427" y="200" fill="#b9cadb" font-size="15">SQLite · 키워드 검색</text><text x="427" y="225" fill="#b9cadb" font-size="15">원문 / 수집 기록 / 파일 근거</text><text x="427" y="250" fill="#b9cadb" font-size="15">로컬 저장 · 해시 검증 백업</text><rect x="770" y="135" width="270" height="160" rx="15" fill="#263a51" stroke="#40546b"/><text x="792" y="171" font-size="19" font-weight="650">03  쓰던 AI에게 질문</text><text x="792" y="200" fill="#b9cadb" font-size="15">Codex · Claude Code</text><text x="792" y="225" fill="#b9cadb" font-size="15">검색 / 비교 / 요약 / 아이디어</text><text x="792" y="250" fill="#b9cadb" font-size="15">출처를 확인하며 활용</text><path d="M310 217 L398 217" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 212 L398 217 L391 222" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M675 217 L763 217" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M756 212 L763 217 L756 222" stroke="#80d9c6" stroke-width="2" fill="none"/><text x="343" y="197" text-anchor="middle" fill="#b9cadb" font-size="12">커넥터</text><text x="721" y="197" text-anchor="middle" fill="#b9cadb" font-size="12">MCP</text><text x="40" y="350" font-size="16" fill="#80d9c6">자료 보관은 로컬에서. 해석과 합성은 연결한 AI에서.</text><text x="40" y="381" font-size="13" fill="#b9cadb">개념 도식 · AI에 제공한 검색 결과는 클라우드로 전송될 수 있습니다.</text></g></svg>
