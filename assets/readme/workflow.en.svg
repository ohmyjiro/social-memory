<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">From saved posts to your next idea.</title><desc id="desc">Social Memory conceptual diagram, not a product screenshot.</desc><rect width="1080" height="420" rx="24" fill="#101b2b"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#edf3fa"><text x="40" y="43" fill="#80d9c6" font-size="13" letter-spacing="2">SOCIAL MEMORY / WORKFLOW</text><text x="40" y="87" font-size="30" font-weight="700">From saved posts to your next idea.</text><rect x="40" y="135" width="270" height="160" rx="15" fill="#263a51" stroke="#40546b"/><text x="62" y="171" font-size="19" font-weight="650">01  Collect your signals</text><text x="62" y="200" fill="#b9cadb" font-size="15">X · Threads · JSON import</text><text x="62" y="225" fill="#b9cadb" font-size="15">Likes / bookmarks / reposts</text><text x="62" y="250" fill="#b9cadb" font-size="15">Dedicated account profiles</text><rect x="405" y="135" width="270" height="160" rx="15" fill="#173932" stroke="#40546b"/><text x="427" y="171" font-size="19" font-weight="650">02  Keep your library</text><text x="427" y="200" fill="#b9cadb" font-size="15">SQLite · keyword search</text><text x="427" y="225" fill="#b9cadb" font-size="15">Sources / captures / evidence</text><text x="427" y="250" fill="#b9cadb" font-size="15">Local storage · checked backups</text><rect x="770" y="135" width="270" height="160" rx="15" fill="#263a51" stroke="#40546b"/><text x="792" y="171" font-size="19" font-weight="650">03  Ask your assistant</text><text x="792" y="200" fill="#b9cadb" font-size="15">Codex · Claude Code</text><text x="792" y="225" fill="#b9cadb" font-size="15">Retrieve / compare / synthesize</text><text x="792" y="250" fill="#b9cadb" font-size="15">Follow the source evidence</text><path d="M310 217 L398 217" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 212 L398 217 L391 222" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M675 217 L763 217" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M756 212 L763 217 L756 222" stroke="#80d9c6" stroke-width="2" fill="none"/><text x="343" y="197" text-anchor="middle" fill="#b9cadb" font-size="12">Connectors</text><text x="721" y="197" text-anchor="middle" fill="#b9cadb" font-size="12">MCP</text><text x="40" y="350" font-size="16" fill="#80d9c6">Local storage for evidence. Your connected assistant for interpretation.</text><text x="40" y="381" font-size="13" fill="#b9cadb">Conceptual flow · Retrieved evidence may be sent to your cloud-connected assistant.</text></g></svg>
