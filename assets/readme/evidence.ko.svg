<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">같은 글이어도, 남긴 관심은 다릅니다.</title><desc id="desc">Social Memory의 개념 도식. 실제 제품 화면이 아닙니다.</desc><rect width="1080" height="420" rx="24" fill="#101b2b"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#edf3fa"><text x="40" y="43" fill="#80d9c6" font-size="13" letter-spacing="2">SOCIAL MEMORY / DATA MODEL</text><text x="40" y="87" font-size="30" font-weight="700">같은 글이어도, 남긴 관심은 다릅니다.</text><rect x="40" y="155" width="260" height="155" rx="15" fill="#263a51" stroke="#40546b"/><text x="62" y="191" font-size="19" font-weight="650">원문 1개</text><text x="62" y="220" fill="#b9cadb" font-size="15">작성자 · 본문 · 원문 링크</text><text x="62" y="245" fill="#b9cadb" font-size="15">같은 플랫폼 · 게시물 ID로 중복 제거</text><rect x="405" y="126" width="245" height="94" rx="15" fill="#263a51" stroke="#40546b"/><text x="427" y="162" font-size="19" font-weight="650">좋아요 기록</text><text x="427" y="191" fill="#b9cadb" font-size="15">수집 계정 · 종류 · 이력</text><rect x="405" y="238" width="245" height="94" rx="15" fill="#263a51" stroke="#40546b"/><text x="427" y="274" font-size="19" font-weight="650">북마크 기록</text><text x="427" y="303" fill="#b9cadb" font-size="15">좋아요와 별도로 보존</text><path d="M300 200 L398 173" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 168 L398 173 L391 178" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M300 260 L398 285" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 280 L398 285 L391 290" stroke="#80d9c6" stroke-width="2" fill="none"/><rect x="745" y="155" width="295" height="155" rx="15" fill="#173932" stroke="#40546b"/><text x="767" y="191" font-size="19" font-weight="650">연결된 근거</text><text x="767" y="220" fill="#b9cadb" font-size="15">확보한 텍스트 · 미디어 링크</text><text x="767" y="245" fill="#b9cadb" font-size="15">가져온 이미지 · PDF 등 파일</text><path d="M650 230 L738 230" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M731 225 L738 230 L731 235" stroke="#80d9c6" stroke-width="2" fill="none"/><text x="40" y="378" font-size="15" fill="#b9cadb">원문, 반응, 근거를 구별하면 AI에게도 맥락을 함께 전달할 수 있습니다.</text></g></svg>
