<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">One source. Different reasons to save.</title><desc id="desc">Social Memory conceptual diagram, not a product screenshot.</desc><rect width="1080" height="420" rx="24" fill="#101b2b"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#edf3fa"><text x="40" y="43" fill="#80d9c6" font-size="13" letter-spacing="2">SOCIAL MEMORY / DATA MODEL</text><text x="40" y="87" font-size="30" font-weight="700">One source. Different reasons to save.</text><rect x="40" y="155" width="260" height="155" rx="15" fill="#263a51" stroke="#40546b"/><text x="62" y="191" font-size="19" font-weight="650">ONE SOURCE</text><text x="62" y="220" fill="#b9cadb" font-size="15">Author · text · original URL</text><text x="62" y="245" fill="#b9cadb" font-size="15">Deduplicated per connector</text><rect x="405" y="126" width="245" height="94" rx="15" fill="#263a51" stroke="#40546b"/><text x="427" y="162" font-size="19" font-weight="650">LIKE CAPTURE</text><text x="427" y="191" fill="#b9cadb" font-size="15">Account · type · history</text><rect x="405" y="238" width="245" height="94" rx="15" fill="#263a51" stroke="#40546b"/><text x="427" y="274" font-size="19" font-weight="650">SAVE CAPTURE</text><text x="427" y="303" fill="#b9cadb" font-size="15">Preserved separately from like</text><path d="M300 200 L398 173" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 168 L398 173 L391 178" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M300 260 L398 285" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M391 280 L398 285 L391 290" stroke="#80d9c6" stroke-width="2" fill="none"/><rect x="745" y="155" width="295" height="155" rx="15" fill="#173932" stroke="#40546b"/><text x="767" y="191" font-size="19" font-weight="650">LINKED EVIDENCE</text><text x="767" y="220" fill="#b9cadb" font-size="15">Available text · media links</text><text x="767" y="245" fill="#b9cadb" font-size="15">Imported images · PDFs · files</text><path d="M650 230 L738 230" stroke="#80d9c6" stroke-width="2" fill="none"/><path d="M731 225 L738 230 L731 235" stroke="#80d9c6" stroke-width="2" fill="none"/><text x="40" y="378" font-size="15" fill="#b9cadb">Separate the source, the signal, and the evidence—so the context survives retrieval.</text></g></svg>
